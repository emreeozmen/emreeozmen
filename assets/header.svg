<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" fill="none" role="img" aria-label="Emre Ozmen - Mathematics Graduate, Data and Business Analyst, FinTech">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#271641"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2E9EF7"/>
      <stop offset="1" stop-color="#8E2DE2"/>
    </linearGradient>
  </defs>

  <rect width="900" height="200" rx="16" fill="url(#bg)"/>

  <g opacity="0.10">
    <rect x="-320" y="-20" width="170" height="240" fill="#ffffff" transform="skewX(-18)">
      <animate attributeName="x" from="-320" to="1120" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="62" y="150" width="0" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;230;230" keyTimes="0;0.5;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <text x="60" y="90" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Emre &#214;zmen</text>

  <g font-family="'Fira Code','Consolas',monospace" font-size="19" fill="#9db8d6">
    <text x="63" y="128" opacity="0">Mathematics Graduate @ Istanbul University
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.27;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="63" y="128" opacity="0">Data Analyst / Business Analyst
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.47;0.52;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="63" y="128" opacity="0">SQL &#183; Python &#183; Power BI &#183; Excel
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.54;0.72;0.77;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="63" y="128" opacity="0">Building a Financial Risk &amp; Portfolio Platform
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.97;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <g fill="url(#accent)">
    <circle cx="822" cy="62" r="6"><animate attributeName="opacity" values="0.25;1;0.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="822" cy="92" r="6"><animate attributeName="opacity" values="0.25;1;0.25" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="822" cy="122" r="6"><animate attributeName="opacity" values="0.25;1;0.25" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
</svg>
